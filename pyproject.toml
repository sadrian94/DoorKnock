[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doorknock"
version = "0.1.0"
description = "DoorKnock (敲門) - AI-assisted Job Hunting & Multi-Touch Outreach Workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "httpcore>=1.0.9,<2",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "typst>=0.12.0",
    "jinja2>=3.1.4",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
